site_name: Python Mastery Path
site_description: Learn Python progressively through topics, modules, mini projects, and real-world projects.
site_url: https://jbakchr.github.io/python-mastery-path/

repo_name: jbakchr/python-mastery-path
repo_url: https://github.com/jbakchr/python-mastery-path

theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Topic Exercises:
      - Strings: topics/strings.md
      - Lists: topics/lists.md
      - Dictionaries: topics/dictionaries.md

  - Module Exercises:
      - pathlib: modules/pathlib.md
      - shutil: modules/shutil.md
      - json: modules/json.md

  - Mini Projects:
      - Downloads Organizer: mini-projects/downloads-organizer.md

  - Real-World Projects:
      - Backup Tool: real-world-projects/backup-tool.md

plugins:
  - search
